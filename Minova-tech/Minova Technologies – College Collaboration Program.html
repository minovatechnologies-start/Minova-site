<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minova Technologies – College Collaboration Program</title>
<link rel="icon" type="image/jpeg" href="site-logo.jpeg">
<link rel="apple-touch-icon" href="site-logo.jpeg">
<style>
:root{--c1:#38bdf8;--c2:#2563eb;--c3:#8b5cf6;--w:#fff;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;font-family:'Poppins','Segoe UI',Arial,sans-serif;color:var(--w);overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#0b2a6b 0%,#041033 45%,#000 100%);background-size:140% 140%;animation:bg 14s ease-in-out infinite alternate}
@keyframes bg{to{background-position:100% 100%}}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:fl 9s ease-in-out infinite alternate}
.o1{width:40vmax;height:40vmax;background:#2563eb;left:-10vmax;top:-10vmax}
.o2{width:32vmax;height:32vmax;background:#38bdf8;right:-8vmax;bottom:-8vmax;animation-delay:-4s;opacity:.25}
@keyframes fl{to{transform:translate(6vmax,5vmax) scale(1.2)}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vmin;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s}
.scene.on{opacity:1}
h1{font-size:clamp(26px,5.4vmin,64px);line-height:1.2;font-weight:800}
h2{font-size:clamp(22px,4.6vmin,52px);font-weight:800;margin-bottom:3vmin}
.hl{color:var(--c1)}
p.sub{font-size:clamp(14px,2.6vmin,28px);color:#bcd4ff;max-width:80vmin;margin-top:2.5vmin}
.tag{letter-spacing:.3em;font-size:clamp(11px,2vmin,20px);color:var(--c1);margin-bottom:2vmin}
.logo{display:none}
.brand-mark{display:grid;place-items:center;width:min(34vmin,260px);aspect-ratio:1;border:1px solid #38bdf855;border-radius:50%;background:radial-gradient(circle,#12346c,#07152f 72%);box-shadow:0 0 60px #2563ebaa;font-size:min(19vmin,150px);line-height:1;animation:pulse 3s ease-in-out infinite}
.grid{display:flex;flex-wrap:wrap;gap:2vmin;justify-content:center;max-width:120vmin}
.card{background:#ffffff12;border:1px solid #38bdf855;border-radius:16px;padding:2.4vmin 3vmin;min-width:20vmin;font-size:clamp(14px,2.6vmin,26px);font-weight:600;backdrop-filter:blur(6px)}
.card small{display:block;font-weight:400;color:#9fc2ff;font-size:.7em;margin-top:.5vmin}
.list{display:flex;flex-direction:column;gap:1.8vmin;text-align:left;font-size:clamp(15px,2.8vmin,30px)}
.list div::before{content:"✔";color:var(--c1);margin-right:1.4vmin}
.step{display:flex;align-items:center;gap:2vmin;background:#ffffff10;border-left:4px solid var(--c1);padding:1.8vmin 3vmin;border-radius:12px;text-align:left;font-size:clamp(14px,2.6vmin,26px);margin:.8vmin 0;width:min(100%,95vmin)}
.step b{background:var(--c2);width:5vmin;height:5vmin;min-width:30px;min-height:30px;border-radius:50%;display:grid;place-items:center}
.pop>*{opacity:0;transform:translateY(30px) scale(.95)}
.on .pop>*{animation:in .7s forwards;animation-delay:calc(var(--i)*.45s + .3s)}
.on .fx{animation:in .9s forwards}
.fx{opacity:0}
@keyframes in{to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 90px #38bdf8cc}}
#bar{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--c1),var(--c3));width:0;transition:width .5s}
#start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:2vmin;align-items:center;justify-content:center;background:#000c;padding:6vmin;text-align:center}
#start button{font-size:clamp(16px,3vmin,28px);padding:1.6vmin 4vmin;border:0;border-radius:50px;background:linear-gradient(90deg,var(--c2),var(--c1));color:#fff;font-weight:700;cursor:pointer}
.mini{position:absolute;top:2vmin;left:2vmin;width:max(9vmin,44px);border-radius:50%;z-index:2;box-shadow:0 0 25px #38bdf8aa}
.brandtext{position:absolute;z-index:2;top:2vmin;left:calc(2vmin + max(9vmin,44px) + 1.4vmin);height:max(9vmin,44px);display:flex;align-items:center;font-size:clamp(16px,3.4vmin,34px);font-weight:800;letter-spacing:.04em;text-shadow:0 0 18px #38bdf8aa}
.brandtext b{color:var(--c1);margin-left:.35em;font-weight:700}
.scene{padding-top:13vmin}
.card{box-shadow:0 0 18px #2563eb44}
#bgfx{position:absolute;inset:0;overflow:hidden}
.gridbg{position:absolute;left:-50%;right:-50%;bottom:-25%;height:75%;background-image:linear-gradient(#38bdf826 1px,transparent 1px),linear-gradient(90deg,#38bdf826 1px,transparent 1px);background-size:60px 60px;transform:perspective(500px) rotateX(65deg);animation:gm 5s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
@keyframes gm{to{background-position:0 60px}}
.fi{position:absolute;bottom:-10vmin;opacity:0;color:#7dd3fc;animation:rise linear infinite;filter:drop-shadow(0 0 8px #38bdf8)}
@keyframes rise{10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(-120vh) rotate(360deg);opacity:0}}
.ring{position:absolute;left:50%;top:50%;border:2px dashed #38bdf855;border-radius:50%;animation:spin 30s linear infinite}
.r1{width:70vmin;height:70vmin;margin:-35vmin 0 0 -35vmin}
.r2{width:98vmin;height:98vmin;margin:-49vmin 0 0 -49vmin;border-color:#8b5cf655;animation-direction:reverse;animation-duration:45s}
@keyframes spin{to{transform:rotate(360deg)}}
.beam{position:absolute;top:0;bottom:0;width:28vmin;background:linear-gradient(90deg,transparent,#38bdf826,transparent);transform:skewX(-20deg);animation:sw 7s linear infinite}
@keyframes sw{from{left:-40vmin}to{left:110%}}
.cd{display:inline-block;font:600 max(.45em,12px)/1.2 Consolas,Menlo,monospace;padding:6px 10px;border:1px solid #38bdf855;border-radius:8px;background:#0b2a6b66;white-space:nowrap}
.badge{width:min(22vmin,170px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#2563eb 0%,#0b2a6b 70%);box-shadow:0 0 0 4px #38bdf8,0 0 60px #38bdf8aa;margin-bottom:3vmin}
.badge svg{width:60%;stroke:#fff}
.on .badge.fx{animation:in .9s forwards,pulse 3s 1s infinite}
</style></head><body>
